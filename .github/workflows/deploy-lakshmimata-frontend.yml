name: Deploy Lakshmimata Frontend

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout server repo (patch)
        uses: actions/checkout@v4
        with:
          path: server

      - name: Checkout Lakshmimata main
        uses: actions/checkout@v4
        with:
          repository: rangaarnaik-lab/Lakshmimata
          path: frontend
          ref: main

      - name: Apply PEAD/CANSLIM patch
        run: git -C frontend apply ../server/deploy/frontend-pead-canslim.patch

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci || npm install
          chmod -R u+x node_modules/.bin 2>/dev/null || true
          node node_modules/vite/bin/vite.js build

      - name: Deploy to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Add VERCEL_TOKEN and VERCEL_PROJECT_ID to lakshmimata-server repo secrets (copy from Lakshmimata repo secrets)."
            exit 1
          fi
          cd frontend
          ARGS=(--prod --token="$VERCEL_TOKEN" --yes)
          if [ -n "$VERCEL_TEAM_ID" ]; then
            ARGS+=(--scope="$VERCEL_TEAM_ID")
          fi
          npx vercel deploy dist "${ARGS[@]}"
